name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems do NOT belong here** — use
        *Security → Report a vulnerability* instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: Sent "/task myapp: fix tests" from Telegram; the task stayed QUEUED forever.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the output of `npm run agent -- doctor`. It contains no secrets.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `data/logs/agent-<date>.log`. Logs are redacted by design, but skim
        them before pasting anyway.
      render: text
  - type: input
    id: cli-version
    attributes:
      label: Agent CLI and version
      placeholder: Copilot CLI 1.0.80 / Claude Code 1.x
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: Windows 11 24H2, Node 22.12
    validations:
      required: true
